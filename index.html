<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aromatica — Scarica l'app</title>
  <link rel="icon" href="assets/icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F8F5F0;
      color: #1C1C1C;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid #DDD8D0;
      border-radius: 20px;
      padding: 40px 28px;
      text-align: center;
    }
    .icon {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      margin: 0 auto 20px;
      display: block;
      box-shadow: 0 4px 16px rgba(59, 94, 43, 0.18);
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #3B5E2B;
      margin-bottom: 6px;
    }
    .tagline {
      font-size: 15px;
      color: #666;
      margin-bottom: 28px;
    }
    .status {
      font-size: 15px;
      color: #333;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      background: #3B5E2B;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .btn:active { opacity: 0.85; }
    ul.features {
      text-align: left;
      list-style: none;
      margin: 20px 0 8px;
      padding: 16px 18px;
      background: #EAF2E3;
      border-radius: 12px;
    }
    ul.features li {
      font-size: 14px;
      color: #333;
      margin-bottom: 8px;
    }
    ul.features li:last-child { margin-bottom: 0; }
    .note {
      font-size: 13px;
      color: #A0A0A0;
      margin-top: 16px;
    }
    a.mail {
      color: #3B5E2B;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon" src="assets/icon.png" alt="Aromatica" />
    <h1>Aromatica</h1>
    <p class="tagline">L'assistente per le piante del tuo balcone 🌿</p>
    <div id="content"></div>
  </div>

  <script>
    var PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.christianmagnani.aromatica';
    var ua = navigator.userAgent || '';
    var isIOS = /iPad|iPhone|iPod/.test(ua);
    var isAndroid = /Android/.test(ua);
    var content = document.getElementById('content');

    // --- Conteggio scan per sistema operativo (GoatCounter, no cookie/no dati personali) ---
    // Etichetta lo scan: /scan/android, /scan/ios oppure /scan/altro.
    // La dashboard mostra quanti iPhone vs Android hanno scansionato la tessera.
    var osLabel = isAndroid ? 'android' : (isIOS ? 'ios' : 'altro');

    // Chi arriva dai social ha ?src=... nel link (pinterest, instagram): lo contiamo
    // a parte come /social/<src>/<os>, così non si mescola con gli scan delle tessere.
    // Le tessere non hanno parametro e restano /scan/<os>, come prima.
    // Il try/catch garantisce che, anche su un browser vecchissimo, si ricada su
    // /scan/ senza mai interrompere lo script.
    var src = '';
    try {
      src = (new URLSearchParams(window.location.search).get('src') || '')
        .toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 20);
    } catch (e) { src = ''; }
    window.goatcounter = { path: (src ? '/social/' + src + '/' : '/scan/') + osLabel };
  </script>
  <script data-goatcounter="https://aromatica.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>

  <script>
    if (isAndroid) {
      content.innerHTML =
        '<p class="status">Ti stiamo portando su Google Play…</p>' +
        '<a class="btn" href="' + PLAY_STORE_URL + '">Apri su Google Play</a>';
      // Piccolo ritardo: dà tempo al conteggio (async) di partire prima del redirect,
      // così gli scan Android non vengono persi. Chi vuole può toccare subito il pulsante.
      setTimeout(function () { window.location.href = PLAY_STORE_URL; }, 800);
    } else if (isIOS) {
      content.innerHTML =
        '<p class="status">📱 Stiamo lavorando alla versione per iPhone.<br>Torna a trovarci presto!</p>' +
        '<ul class="features">' +
          '<li>💧 Promemoria intelligenti di annaffiatura</li>' +
          '<li>🌦️ Meteo in tempo reale sul tuo balcone</li>' +
          '<li>🧭 Bussola integrata per l\'esposizione</li>' +
          '<li>🔒 Nessun account richiesto</li>' +
        '</ul>' +
        '<p class="note">Vuoi sapere quando arriva su iOS? Scrivici a<br>' +
          '<a class="mail" href="mailto:magnani.christian.dev@gmail.com?subject=Aromatica%20iOS">magnani.christian.dev@gmail.com</a></p>';
    } else {
      content.innerHTML =
        '<p class="status">Aromatica è disponibile su Android.</p>' +
        '<a class="btn" href="' + PLAY_STORE_URL + '">Scarica su Google Play</a>' +
        '<p class="note">📱 La versione per iPhone è in lavorazione.</p>';
    }
  </script>
</body>
</html>
